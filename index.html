<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman Playground</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header id="toolbar">
  <span id="brand">Stickman</span>
  <div id="selectionChip">
    <input id="colorPicker" type="color" value="#e53935" aria-label="Figure color">
    <span id="readoutText" aria-live="polite">Add a figure to start</span>
    <span id="powerGlyph" title="Superpower"></span>
    <button id="revokeBtn" type="button" hidden title="Remove the superpower (R)" aria-label="Revoke superpower">&times;</button>
    <button id="removeBtn" type="button" hidden title="Remove selected figure(s) (Delete)" aria-label="Remove selected figure(s)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h16"/>
        <path d="M9 7V5h6v2"/>
        <path d="M7 7l1 13h8l1-13"/>
        <path d="M10 11v5M14 11v5"/>
      </svg>
    </button>
  </div>
  <div id="globalControls">
    <button id="addBtn" class="primary" type="button" aria-label="Add stick figure" title="Add a stick figure (A)">Add</button>
    <label class="auton-label" title="Figures randomly switch actions on their own">
      <input id="autonChk" type="checkbox" checked aria-label="Autonomous mode">
      <span class="auton-full">Autonomous</span><span class="auton-short">Auto</span>
    </label>
    <select id="sceneSelect" aria-label="Background scene">
      <option value="paper">Paper</option>
      <option value="lake">Lake</option>
      <option value="factory">Factory</option>
      <option value="bridge">Bridge</option>
      <option value="highway">Highway</option>
      <option value="island">Island</option>
    </select>
    <button id="muteBtn" class="icon-btn" type="button" aria-pressed="false" aria-label="Mute sound" title="Mute sound (M)">
      <span class="sound-on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4z"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
          <path d="M18.5 6a8 8 0 0 1 0 12"/>
        </svg>
      </span>
      <span class="sound-off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4z"/>
          <path d="m16 9 5 6"/>
          <path d="m21 9-5 6"/>
        </svg>
      </span>
    </button>
    <button id="cinematicBtn" class="icon-btn" type="button" aria-pressed="true" aria-label="Cinematic camera" title="Cinematic camera and letterbox (C)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="7" width="12" height="10" rx="1.5"/>
        <path d="m15 10 5-3v10l-5-3z"/>
      </svg>
    </button>
  </div>
</header>
<div id="dock" role="toolbar" aria-label="Figure actions">
  <div class="dock-group">
    <span class="dock-label">Motion</span>
    <div class="segmented" role="group" aria-label="Motion">
      <button type="button" data-action="idle" aria-pressed="false" title="Idle (1)">Idle</button>
      <button type="button" data-action="crawl" aria-pressed="false" title="Crawl (2)">Crawl</button>
      <button type="button" data-action="walk" aria-pressed="false" title="Walk (3)">Walk</button>
      <button type="button" data-action="run" aria-pressed="false" title="Run (4)">Run</button>
      <button type="button" data-action="jump" aria-pressed="false" title="Jump (5)">Jump</button>
    </div>
  </div>
  <div class="dock-sep"></div>
  <div class="dock-group">
    <span class="dock-label">Combat</span>
    <button type="button" data-action="fight" aria-pressed="false" title="Fight nearest enemy of another color (F)">Fight</button>
    <button type="button" data-action="power" title="Grant or remove the superpower (P)">Give Power</button>
    <button type="button" data-action="blast" title="Blast the nearest figure or your chase target (B)">Blast</button>
  </div>
  <div class="dock-sep"></div>
  <div class="dock-group">
    <label class="dock-label" for="styleSelect">Style</label>
    <select id="styleSelect" aria-label="Fighting style" title="Fighting style">
      <option value="brawler">Brawler</option>
      <option value="wingchun">Wing Chun</option>
      <option value="muaythai">Muay Thai</option>
      <option value="mixed" disabled>Mixed</option>
    </select>
  </div>
</div>
<canvas id="c"></canvas>
<div id="letterbox" aria-hidden="true"><span></span><span></span></div>
<div id="vignette" aria-hidden="true"></div>
<div id="screentone" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
